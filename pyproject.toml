[project]
name = "soton_lm_data"
version = "0.1.0"
description = "Data engineering pipeline for the SotonLM project at the University of Southampton."
readme = "README.md"
requires-python = ">=3.10"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "UP", # pyupgrade
]
